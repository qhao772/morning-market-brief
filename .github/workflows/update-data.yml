name: Update market data

# Runs automatically every day at 21:00 UTC, which is 06:00 the next day in
# Korea (KST = UTC+9). You can also trigger it manually from the "Actions"
# tab on GitHub using the "Run workflow" button (workflow_dispatch).
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

# Needed so this workflow is allowed to commit the updated data.json back to
# the repository. If the push step below ever fails with a permissions
# error, go to: repo Settings > Actions > General > Workflow permissions,
# and choose "Read and write permissions".
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh market data into data.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_data.py

      - name: Commit and push data.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily market data update"
            git push
          fi
